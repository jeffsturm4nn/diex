<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<h:head>
		<title>.:: DIEX - Dados de Servidor ::.</title>
		<link rel="stylesheet" href="SemBorda.css" />
    </h:head>
    
    <h:body>
    <h1>Dados de Servidor</h1>
    <hr style="color:#33cc00" width="100%" align="left" noshade="noshade"/>
        	
    	
<!-- ...... Dados de usuário, para o servidor logar no site ........................................................ -->
    	
    	<h:form>
    		<p:panelGrid styleClass="semBorda"> <!-- CSS para esconder bordas do PanelGrid-->
    			<p:row>
    				<p:column colspan="4"><br/>
    					<hr style="color:#33cc00; size:0" width="100%" align="left" noshade="noshade"/>
    				</p:column>
    			</p:row>
    			<p:row>
       				<p:column>
       					<p:outputLabel value="Código: #{controleServidor.servidor.codigo}"/>
       					<p:inputText type="hidden" value="#{controleServidor.servidor.codigo}"/>
       				</p:column>
       				<p:column colspan="2"/>
       					<p:column>
       				    	<p:outputLabel value="Cadastrado em: #{controleServidor.servidor.dataCadastro}"/>
       						<p:inputText type="hidden" value="#{controleServidor.servidor.dataCadastro}"/>
       				    </p:column>
       			</p:row>
    			<p:row>
    				<p:column><h:outputText value="Tipo Servidor: "/></p:column>
    				<p:column><p:outputLabel value="#{controleServidor.servidor.tipoServidor.tipoServidor}"/></p:column>
    			</p:row>
    			<p:row>
    				<p:column><h:outputText value="SIAPE: "/></p:column>
    				<p:column><p:outputLabel value="#{controleServidor.servidor.usuario.siape}"/></p:column>
    			</p:row> <!-- 
    			<p:row>
    				<p:column><h:outputLabel value="Senha: " /></p:column>
					<p:column><p:button value="Alterar" href="/FormularioAlterarSenha.jsf"/></p:column>
				</p:row>  -->
    		
    		
<!-- .......... Formulário para preenchimento com Dados Pessoais do Servidor .............................. -->

	    		<p:row>
	    			<p:column colspan="4">
	       				<br/><h:outputText value="Dados Pessoais" />
	       				<hr style="color:#33cc00; size:0" width="100%" align="left" noshade="noshade"/>
	       			</p:column>
	       		</p:row>
	       		<p:row>
	            	<p:column><h:outputLabel value="Nome: " /></p:column>
	            	<p:column colspan="3"><p:outputLabel value="#{controleServidor.servidor.nome}"/></p:column>
	            </p:row>
				<p:row>
	            	<p:column><h:outputLabel value="Email: " /></p:column>
	            	<p:column colspan="3"><p:outputLabel value="#{controleServidor.servidor.email}"/></p:column>
	            </p:row>
				<p:row>
					<p:column><h:outputLabel value="Fone: "/></p:column>
					<p:column colspan="3"><p:outputLabel value="#{controleServidor.servidor.telefone}"/></p:column>
				</p:row>
				
				
<!-- .............. Informações de Trabalho .................................................................. -->
				
	       		<p:row>
	       			<p:column colspan="4">       				
       				<br/><hr style="color:#33cc00; size:0" width="100%" align="left" noshade="noshade"/>
       				</p:column>
       			</p:row>
       			<p:row>
       				<p:column><h:outputText value="Coordenação*: "/> </p:column>
       				<p:column colspan="3"><p:outputLabel value="#{controleServidor.servidor.coordenacao.coordenacao}"/></p:column>
       			</p:row>
       			<p:row>
       				<p:column><h:outputText value="Unidade de Ensino*: "/></p:column>
    				<p:column><p:outputLabel value="#{controleServidor.servidor.unidadeEnsino}"/></p:column>
       			</p:row>
       			<p:row>
       				<p:column colspan="3"/>
       				<p:column><br/> <!-- 
       					<p:commandButton id="editar" value="Editar" ajax="false"
       									 oncomplete="location.href='EdicaoServidor.jsf'" />  -->
       					<p:commandButton id="voltar" value="Voltar" ajax="false"
       									 action="/ListarServidores.xhtml?faces-redirect=true" immediate="true" />
       				</p:column>
       			</p:row>
			</p:panelGrid>
		</h:form>
    </h:body>
</html>
