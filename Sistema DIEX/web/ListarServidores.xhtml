<?xml version="1.0" encoding="ISO-8859-1" ?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">
<h:head>
	<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1" />
	<title>.:: DIEX - Lista de Servidores Cadastrados ::.</title>
	<link rel="stylesheet" href="../CSS/diex.css" type="text/css"></link>
</h:head>

<h:body>
    
	<h1>Lista de Servidores Cadastrados</h1>
	<hr style="color:#33cc00" width="100%" align="left" noshade="noshade"/>
	<br />
	<h:link outcome="index" value="Página Inicial"/><br/>
        
        <p:growl id="growl" autoUpdate="true" life="3200"  />
        
	<p:panelGrid id="grid" styleClass="semBorda" columns="1">

		<h:form id="listaForm">

			<p:dataTable id="lista" emptyMessage="Nenhum servidor encontraro." 
                                     rowKey="#{servidor.codigo}" var="servidor" paginator="true"
                                     rows="14" value="#{controleServidor.listar()}" 
                                     selection="#{controleServidor.selecionado}" selectionMode="single"
                                     filteredValue="#{controleServidor.listaFiltrados}" 
                                     sortBy="#{servidor.nome}">
                                
				<f:facet name="header">
                        Lista de Servidores
                    </f:facet>

				<p:column headerText="Nome" resizable="true" width="550"
					sortBy="#{servidor.nome}" filterBy="#{servidor.nome}"
					filterMatchMode="contains">
					<h:outputText value="#{servidor.nome}"></h:outputText>
				</p:column>

				<p:column headerText="SIAPE" resizable="true"
					sortBy="#{servidor.usuario.siape}"
					filterBy="#{servidor.usuario.siape}" filterMatchMode="contains">
					<h:outputText value="#{servidor.usuario.siape}"></h:outputText>
				</p:column>

				<p:column headerText="E-Mail" resizable="true" sortBy="#{servidor.email}"
					filterBy="#{servidor.email}" filterMatchMode="contains">
					<h:outputText value="#{servidor.email}"></h:outputText>
				</p:column>

				<p:column headerText="Telefone" resizable="true" sortBy="#{servidor.telefone}"
					filterBy="#{servidor.telefone}" filterMatchMode="contains">
					<h:outputText value="#{servidor.telefone}"></h:outputText>
				</p:column>

				<f:facet name="footer1">
					<h:outputText value=" "></h:outputText>
				</f:facet>
			</p:dataTable>

			<p:confirmDialog id="confirmarExclusao" rendered="true"
				closable="false" message="Deseja realmente excluir este servidor?"
				header="Confirmação de Exclusão" severity="alert"
				widgetVar="confirmDialog">

				<p:commandButton id="confirmar" value="Excluir" update="lista"
					oncomplete="confirmDialog.hide()"
					action="#{controleServidor.remover()}" />

				<p:commandButton id="cancelar" value="Cancelar"
					onclick="confirmDialog.hide()" type="button" />
			</p:confirmDialog>

			<h:panelGroup>
                    <p:commandButton value="Exibir" global="true" ajax="false"
                                     action="#{controleServidor.preparaVisualizacao()}" update="lista"
                                     icon="ui-icon-search" oncomplete="#{DadosServidor}"></p:commandButton>
                    <p:commandButton value="Editar" icon="ui-icon-pencil"
                                     action="#{controleServidor.preparaEdicao()}" update="lista"></p:commandButton>
                    <p:commandButton value="Excluir" icon="ui-icon-trash"
                                     onclick="confirmDialog.show();" type="button"></p:commandButton>
            </h:panelGroup>
		</h:form>
	</p:panelGrid>

</h:body>

</html>
